# The website (apps/website) on one server behind Caddy: Caddy fetches the certificate for WEBSITE_DOMAIN and speaks HTTP/1.1, 2 and 3;
# the docs answer only Caddy. Run it from this directory, next to a .env with the settings below (never in the repository —
# .gitignore and the image's .dockerignore keep it out):
#
#   WEBSITE_DOMAIN=marmeon.com
#   WEBSITE_REDIRECT_DOMAINS=www.marmeon.com, marmeon.de, www.marmeon.de, marmeon.dev, www.marmeon.dev   # optional (WEBSITE_DOMAIN and APP_KEY are required): 301 to WEBSITE_DOMAIN
#   WEBSITE_FATHOM_SITE=IBAFAHEM   # optional (default: the production site): the Fathom Analytics site id; empty: no analytics, no script, no CSP change
#   APP_KEY=base64:…            # docker run --rm marmeon-website key:generate --show  (or: openssl rand -base64 32, prefixed base64:)
#
#   docker compose up -d --build        # build the image from this checkout and start both containers
#   docker compose logs -f docs         # the docs' JSON log
#
# Updates, rollback, backups: docs/deployment.md.
name: marmeon-website

services:
  docs:
    build:
      context: ../..
      dockerfile: apps/website/Dockerfile
    # WEBSITE_TAG names a build (e.g. the commit): WEBSITE_TAG=$(git rev-parse --short HEAD) docker compose up -d --build; an older tag
    # that is still on the machine starts again without a build (the rollback).
    image: marmeon-website:${WEBSITE_TAG:-latest}
    # No `init: true`: the image's PID 1 is tini — it passes signals on and reaps orphans.
    restart: unless-stopped
    # The image's files cannot change (the discovery manifest is built in); only storage/ and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    environment:
      APP_KEY: ${APP_KEY:?set APP_KEY in deploy/website/.env (marmeon key:generate --show)}
      APP_URL: https://${WEBSITE_DOMAIN:?set WEBSITE_DOMAIN in deploy/website/.env, e.g. docs.example.com}
      APP_NAME: Marmeon
      # Fathom Analytics (production only: the script and Fathom's origin in script-src). Empty in deploy/website/.env turns it off.
      SITE_FATHOM_SITE: ${WEBSITE_FATHOM_SITE-IBAFAHEM}
      # Only Caddy shares the network below with the docs — so its X-Forwarded-For/-Proto/-Host count: the search's rate
      # limit sees each visitor's address, not Caddy's. Change the subnets together with the network.
      TRUSTED_PROXIES: 172.30.80.0/24,fd5b:c0de:d0c5::/64
    volumes:
      # The rate limit's cache and Node's compile cache — nothing to back up; a new volume only makes the first start slower.
      - storage:/app/storage
    networks:
      - edge
    # SIGTERM → drain (at most 10 s) — before Docker sends SIGKILL.
    stop_grace_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN}
      # The hosts that redirect to WEBSITE_DOMAIN (comma-separated); empty: none (the placeholder is never asked for).
      WEBSITE_REDIRECT_DOMAINS: ${WEBSITE_REDIRECT_DOMAINS:-http://redirects.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates and Caddy's ACME account: keep this volume (a new one asks Let's Encrypt again — rate-limited).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      docs:
        condition: service_healthy

networks:
  edge:
    # With IPv6 on the network, Docker forwards a visitor's IPv6 connection to Caddy as it is; without, Caddy would see Docker's
    # gateway for every IPv6 visitor.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.80.0/24
        - subnet: fd5b:c0de:d0c5::/64

volumes:
  storage:
  caddy_data:
  caddy_config:
