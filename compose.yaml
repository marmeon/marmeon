# Databases for the framework's own tests: `docker compose up -d`, then `pnpm test:pgsql`, `pnpm test:redis` and `pnpm test:s3`.
# Own ports on purpose — 5432/3306 may belong to other projects on the same machine.
# An app reaches the Postgres here with DB_CONNECTION=pgsql, DB_HOST=127.0.0.1, DB_PORT=55432, DB_DATABASE=marmeon,
# DB_USERNAME=marmeon and DB_PASSWORD=secret (or DB_URL=postgres://marmeon:secret@localhost:55432/marmeon).
name: marmeon

services:
  pgsql:
    image: postgres:18-alpine
    container_name: marmeon-pgsql
    ports:
      - '127.0.0.1:55432:5432'
    environment:
      POSTGRES_USER: marmeon
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: marmeon
    # Test data is disposable: no volume, and fsync off for speed.
    command: ['postgres', '-c', 'fsync=off', '-c', 'synchronous_commit=off', '-c', 'full_page_writes=off']
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'marmeon']
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    image: redis:8-alpine
    container_name: marmeon-redis
    ports:
      - '127.0.0.1:56379:6379'
    # Test data is disposable: no snapshots, no append-only file.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 15

  # An S3-compatible store for the S3 disk (`pnpm test:s3`): SeaweedFS (Apache-2.0, maintained) — MinIO's community
  # edition is archived and its images are gone from Docker Hub; LocalStack's image needs an account token since 2026.03.
  # One process (`weed mini`), S3 on 56333, signatures checked against the identity below.
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: marmeon-s3
    ports:
      - '127.0.0.1:56333:8333'
    command: ['mini', '-dir=/data', '-s3.config=/etc/seaweedfs/s3.json', '-admin.ui=false', '-webdav=false']
    configs:
      - source: s3-identities
        target: /etc/seaweedfs/s3.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1']
      interval: 2s
      timeout: 2s
      retries: 30

configs:
  # Test credentials only (MARMEON_TEST_S3_KEY / MARMEON_TEST_S3_SECRET default to them).
  s3-identities:
    content: |
      {"identities": [{"name": "marmeon", "credentials": [{"accessKey": "marmeon", "secretKey": "marmeon-secret"}], "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
