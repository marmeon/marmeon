# The OpenSSF Scorecard: how well the repository follows supply-chain practices (pinned actions, reviewed changes, a security
# policy, signed releases, …), scored on every push to main, once a week and when the branch protection changes. The result is
# published to the public Scorecard API (the badge in the README, deps.dev and Socket read it from there) and uploaded to code
# scanning, where only maintainers see it. Not a required check; it never runs on a pull request.
#
# `publish_results` holds the job to the shape below: no top-level `env` or `defaults`, no container or service, a hosted
# `ubuntu-*` runner, and only approved actions. The workflow's permissions are empty, the job's exactly what the scorecard,
# the upload and the OIDC token of the publication need; the checkout leaves no credentials behind.
# `scripts/check-release.ts` keeps the file to its shape, line by line.
name: Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 3'
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
