# A pull request that removes or changes a line of a package's `api.md` needs the label `breaking` (a change that breaks no app may
# carry `api-compatible` instead; a removal never); a new line needs a release label other than `docs` and `internal`. This check
# reminds; it does not protect — a pull request runs its own copy of it, the review is the protection. Unlike `pr-label.yml` it
# needs the files, so it checks out; hence the shape, which `scripts/check-release.ts` keeps: the `pull_request` event (never
# `pull_request_target`: a fork's code must not get a token), no permission but reading the contents, a checkout that leaves no
# credentials behind, actions pinned by SHA, no secret, and no install — the script loads only `node:*` and one file next to
# it, so the pull request's code never runs a package script. The labels reach the script through env, never through an
# expression inside it. The checkout is the merge commit GitHub builds; the script compares it with its first parent.
#
# The same script holds the fixtures of stored and wire formats (`packages/*/src/__fixtures__/formats/**`): changing, renaming or
# deleting one needs `breaking`, and `api-compatible` does not lift that.
#
# It also refuses a pull request that changes, renames or deletes a migration under a package's `stubs/` (the kit's among them)
# or that adds a migration which sorts before a shipped file, repeats the name of one in its directory or sits in a directory its
# package does not ship migrations from yet (the first `stubs/migrations` of a package aside). No label lifts that.
#
# Mark the check "api label" as required in the ruleset of `main`.
name: API label

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]

permissions: {}

concurrency:
  group: api-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: api label
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: require the labels the API change needs
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node scripts/api-label.ts
