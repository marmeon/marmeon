# Releases: started by hand, staged with trusted publishing — and never live without a maintainer.
#
# Start it with "Run workflow" from `main` (any version above npm's latest) or from a maintenance branch (`0.<minor>.x` below 1.0,
# `<major>.x` from 1.0 on) for a late fix of an older line. Anyone with write access can start it; the gate is the maintainer's
# two-factor approval on npmjs.com, not who clicks. The file runs from the branch head, but what it builds, stages, tags and drafts
# is the release commit: the branch's last change to the changelogs or to .github/release-base (the merged release pull request of
# `pnpm release:prepare`). Later merges go into the next release.
#
# Three jobs, so that no step holds the OIDC token together with code of the repository or of its dependencies, or together with the
# write token:
#
#   build    (contents: read, no id-token) — runs the repository's scripts and its dependencies' code
#     1. scripts/release-guard.ts, before anything is installed: the branch, the release commit (checked out, detached — every later
#        step works on it and none may switch away), one version, v<version> not tagged, the version on no package of npm, the
#        release base, and the dist-tag (`latest`, `latest-<line>` for a late fix of an older line, or `next` for a release candidate, which
#        only `main` releases).
#     2. The checks: a clean build, the content rules, publint, attw, the release rules. No cache is restored: a store written by
#        another workflow could carry code into this job.
#     3. scripts/release-pack.ts: `pnpm pack` of every package, and SHA512SUMS naming each tarball. The hash of SHA512SUMS is the
#        job's output `sums`; the tarballs and SHA512SUMS are uploaded as the artifact `tarballs` (kept for a day).
#   stage    (environment: npm-release, id-token: write, contents: read) — installs nothing, checks out nothing, runs no script of the repository
#     4. Downloads the artifact, checks SHA512SUMS against the output `sums` and the tarballs against SHA512SUMS, checks that
#        every package trusts this workflow (the token exchange of npm; nothing is staged unless all pass; a tarball whose publishConfig
#        holds more than access and provenance is refused, and so are the tarball shapes the check knows to be read differently by
#        tar and npm), then
#        `npm stage publish` of exactly the tarballs SHA512SUMS names, with the dist-tag (OIDC, no token anywhere; provenance from
#        this workflow). Nothing is public until a maintainer approves the staged versions on npmjs.com with two-factor
#        authentication (npm stage approve). The trusted-publisher configuration of every package allows staging only
#        (scripts/npm-trust.sh). The job prints SHA512SUMS: the maintainer rebuilds the release commit and compares before approving.
#   release  (contents: write, no id-token) — installs nothing and runs no repository code but the notes script
#     5. The tag v<version> on the release commit, and a draft GitHub Release with the notes of the changelog — a draft, never
#        public: the maintainer publishes it after approving on npm.
#
# Never start it again after a run that staged: the tag guard only helps once the tag exists, and a staged version is invisible to
# `npm view`. What to do with a failed or rejected run: CONTRIBUTING.md › "Pull requests and releases" › "When a run fails".
#
# scripts/check-release.ts (a part of `pnpm run ci`) checks this file as a review aid, not as a barrier: dispatch only, the
# guard first and nothing switching away from the release commit after it, id-token only in the job that stages — which has no
# checkout, no pnpm and runs nothing but the hash checks, the trust check and `npm stage publish`, and is the only job in `environment: npm-release` —
# the write token only in the release job's last
# two steps, every action pinned by full SHA, no npm publish, no token, no cache, a GitHub Release only as a draft, no expression
# inside a script.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
      version: ${{ steps.guard.outputs.version }}
      latest: ${{ steps.guard.outputs.latest }}
      prerelease: ${{ steps.guard.outputs.prerelease }}
      dist-tag: ${{ steps.guard.outputs.dist-tag }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard finds the release commit and the previous tag in the history
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the action's default restores a pnpm store by itself
      # Checks out the release commit (detached); every step below works on it. Imports node:* only: it runs before any install.
      - id: guard
        run: node scripts/release-guard.ts
      - run: pnpm install --frozen-lockfile
      # The tarballs as they will be staged: a clean build, the content rules, publint, attw — and the release rules.
      - run: pnpm run ci --only build,pack:check,check-release
      # Packed and hashed here, staged by the next job: the tree must still be exactly the release commit the guard checked out.
      - id: pack
        name: pack the tarballs
        env:
          COMMIT: ${{ steps.guard.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          status=$(git status --porcelain)
          test -z "$status"
          node scripts/release-pack.ts "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          retention-days: 1
          if-no-files-found: error

  stage:
    name: stage the packages on npm
    needs: build
    # Trusted publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusts the staging only from this environment; its deployment branches are `main` and `*.x`.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      # npm 11.15 or later stages. Keep the version the one in .nvmrc (the Node that built the tarballs): check-release compares them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false # the action's default restores a pnpm store by itself
      # Staged, not published: every package waits for a maintainer's approval with 2FA on npmjs.com. Only the files SHA512SUMS names
      # are staged, and only after the build job's hash of SHA512SUMS and the hash of every tarball matched.
      - name: stage the tarballs
        env:
          TARBALLS: ${{ runner.temp }}/tarballs
          SUMS: ${{ needs.build.outputs.sums }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          # No npmrc of the user or the machine: npm reads a registry, a proxy and TLS settings from them. Two different paths that do
          # not exist (npm refuses the same file as user and as global config).
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/no-userconfig
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/no-globalconfig
        run: |
          set -o pipefail
          # The build job's output: anything but a bare hash would reach the log through the hash check's own messages.
          [[ "$SUMS" =~ ^[0-9a-f]{128}$ ]] || { echo "::error::the build job's hash of SHA512SUMS is not a SHA-512 hash; this attempt staged nothing"; exit 1; }
          if [[ "$VERSION" == *-rc.* ]]; then [[ "$DIST_TAG" == next ]] || { echo "::error::a release candidate goes out under next only"; exit 1; }; else [[ "$DIST_TAG" =~ ^latest(-[0-9]+(\.[0-9]+)?)?$ ]] || { echo "::error::a release goes out under latest or latest-<line>, never next"; exit 1; }; fi
          mkdir "$RUNNER_TEMP/empty"
          cd "$TARBALLS"
          printf '%s  SHA512SUMS\n' "$SUMS" | sha512sum --check --strict -
          # SHA512SUMS is the build job's file: before a command prints a name from it, every line must be a hash and a plain tarball name.
          ! grep -qvxE '[0-9a-f]{128}  [a-z0-9.-]+\.tgz' SHA512SUMS || { echo "::error::SHA512SUMS has a line that is not a hash and a tarball name"; exit 1; }
          sha512sum --check --strict SHA512SUMS
          # The artifact holds SHA512SUMS and the files it names, nothing else (no dotfile, no directory): npm would read a .npmrc.
          expected=$( { echo ./SHA512SUMS; awk '{ print "./" $2 }' SHA512SUMS; } | sort )
          found=$(find . -mindepth 1 | sort)
          test "$expected" = "$found"
          cat SHA512SUMS
          # npm runs in an empty directory, so it finds no project npmrc; the tarballs are named by absolute path.
          cd "$RUNNER_TEMP/empty"
          # Every package must trust this workflow before the first one is staged: a package without trust stops npm halfway, and a
          # staged version can never be staged again. The same token exchange as npm's own; its answer (an npm token) is discarded.
          failures=0
          while read -r _ name; do
            test "${name%-"$VERSION".tgz}" != "$name" || { echo "::error::$name is not a tarball of version $VERSION"; exit 1; }
            # Defence in depth: refuse the tarball shapes known to make tar and npm read different manifests (a second package.json
            # under another spelling, a tar that reads past zero blocks so that a second package.json behind one is seen, entries that are not plain files). The flags of the staging below
            # pin the registry whatever the manifest holds.
            members=$(tar -tizf "$TARBALLS/$name" < /dev/null 2> /dev/null) || members=
            kinds=$(tar -tvizf "$TARBALLS/$name" < /dev/null 2> /dev/null | cut -c1) || kinds=
            if ! { [[ -n "$members" && -n "$kinds" && "$(grep -cxF package/package.json <<< "$members")" == 1 ]] && ! grep -qvE '^package/' <<< "$members" && ! grep -qE '//|(^|/)\.\.?(/|$)' <<< "$members" && ! grep -qvx -- - <<< "$kinds"; }; then
              echo "::error::$name is not a tarball the stage job accepts; this attempt staged nothing"
              exit 1
            fi
            # One pass over the manifest: the name, and whether publishConfig holds nothing but what the packages carry. npm copies every
            # publishConfig key into its options (a registry, a proxy): a tarball that carries more is refused before it meets the token.
            info=$(tar -xizOf "$TARBALLS/$name" package/package.json < /dev/null 2> /dev/null | jq -r '[.name, (has("publishConfig") | not) or (.publishConfig | type == "object" and (to_entries | all(.key == "access" and .value == "public" or .key == "provenance" and .value == true)))] | join(" ")') || info=
            package=${info% *}
            [[ "$package" =~ ^(marmeon|create-marmeon|@marmeon/[a-z0-9-]+)$ ]] || { echo "::error::$name holds a package name that is not one of ours"; exit 1; }
            [[ "${info##* }" == true ]] || { echo "::error::$package has a publishConfig the stage job does not accept; this attempt staged nothing"; exit 1; }
            # The credentials go through stdin (-H @-), never onto a command line.
            token=$(curl -q --proto '=https' -sS --max-time 10 -H @- "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" <<< "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value // empty') || token=
            status=no-id-token
            if [[ -n "$token" ]]; then
              # npm counts a 2xx without a token in the body as a failure. The body goes straight into jq: of the token only "there is one" comes out, never a shell variable or a file.
              exchange=$(curl -q --proto '=https' -sS --max-time 10 -X POST -H @- -o - -w '\n%{http_code}' "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${package/\//%2F}" <<< "Authorization: Bearer $token" | jq -Rrs '(split("\n") | last) as $code | .[:length - ($code | length) - 1] as $body | "\($code) \($body | try (fromjson | (.token | type == "string" and length > 0)) catch false)"') || exchange='failed false'
              status=${exchange% *}
              [[ "$status" =~ ^2[0-9][0-9]$ && "${exchange#* }" != true ]] && status="$status-without-token"
            fi
            [[ "$status" =~ ^2[0-9][0-9]$ ]] && continue
            failures=$((failures + 1))
            if [[ "$status" =~ ^(401|403|404)$ ]]; then
              echo "::error::$package has no working trusted publisher for the environment npm-release (exchange: $status); this attempt staged nothing: run npm trust github $package --repository marmeon/marmeon --file release.yml --environment npm-release --allow-stage-publish, then Re-run failed jobs"
            else
              echo "::error::$package: could not ask the registry (exchange: $status); this attempt staged nothing: Re-run failed jobs"
            fi
          done < "$TARBALLS/SHA512SUMS"
          test "$failures" = 0 || exit 1
          # Up to 60 requests of 10 seconds at most: the staging keeps the time the job has left.
          test "$SECONDS" -lt 300 || { echo "::error::the trust check took $SECONDS seconds; this attempt staged nothing: Re-run failed jobs"; exit 1; }
          while read -r _ name; do
            test "${name%-"$VERSION".tgz}" != "$name"
            # Flags win over the manifest's publishConfig: they pin the registry (--scope: an unscoped package takes its registry from
            # the scope too), the proxies, strict-ssl and cafile, so a manifest cannot move where npm sends the token and the tarball.
            npm stage publish "$TARBALLS/$name" --provenance --access public --tag="$DIST_TAG" --registry=https://registry.npmjs.org/ --@marmeon:registry=https://registry.npmjs.org/ --scope=@marmeon --strict-ssl=true --proxy=null --https-proxy=null --cafile=null < /dev/null
          done < "$TARBALLS/SHA512SUMS"

  release:
    name: tag and draft the release
    needs: [build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the draft GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the action's default restores a pnpm store by itself
      - name: tag the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          # A re-run of this job (after a failed draft) finds its own tag: the same commit is fine, another one is not.
          existing=$(git ls-remote origin "refs/tags/v$VERSION^{}" | cut -f1)
          if [ -z "$existing" ]; then existing=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1); fi
          if [ -z "$existing" ]; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "v$VERSION" -m "v$VERSION" "$COMMIT"
            encoded=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$encoded"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $encoded" push origin "refs/tags/v$VERSION"
          elif [ "$existing" = "$COMMIT" ]; then
            echo "::notice::v$VERSION is already tagged on $COMMIT"
          else
            echo "::error::v$VERSION already points to $existing, not to the release commit $COMMIT"
            exit 1
          fi
      # A draft: it becomes public only when the maintainer publishes it, after approving the staged versions on npm. The tag binds
      # it to the release commit; it is the latest release only when the version is above npm's latest, and a prerelease when it is a release candidate.
      - name: draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ needs.build.outputs.latest }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --draft --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST" --prerelease="$PRERELEASE"
