# Releases: started by hand, staged with trusted publishing — and never live without a maintainer.
#
# Start it with "Run workflow" from `main` (any version above npm's latest) or from a maintenance branch (`0.<minor>.x` below 1.0,
# `<major>.x` from 1.0 on) for a late fix of an older line. Anyone with write access can start it; the gate is the maintainer's
# two-factor approval on npmjs.com, not who clicks. The file runs from the branch head, but what it builds, stages, tags and drafts
# is the release commit: the branch's last change to the changelogs or to .github/release-base (the merged release pull request of
# `pnpm release:prepare`). Later merges go into the next release.
#
# Three jobs, so that no step holds the OIDC token together with code of the repository or of its dependencies, or together with the
# write token:
#
#   build    (contents: read, no id-token) — runs the repository's scripts and its dependencies' code
#     1. scripts/release-guard.ts, before anything is installed: the branch, the release commit (checked out, detached — every later
#        step works on it and none may switch away), one version, v<version> not tagged, the version on no package of npm, the
#        release base, and the dist-tag (`latest`, or `latest-<line>` for a late fix of an older line).
#     2. The checks: a clean build, the content rules, publint, attw, the release rules. No cache is restored: a store written by
#        another workflow could carry code into this job.
#     3. scripts/release-pack.ts: `pnpm pack` of every package, and SHA512SUMS naming each tarball. The hash of SHA512SUMS is the
#        job's output `sums`; the tarballs and SHA512SUMS are uploaded as the artifact `tarballs` (kept for a day).
#   stage    (environment: npm-release, id-token: write, contents: read) — installs nothing, checks out nothing, runs no script of the repository
#     4. Downloads the artifact, checks SHA512SUMS against the output `sums` and the tarballs against SHA512SUMS, then
#        `npm stage publish` of exactly the tarballs SHA512SUMS names, with the dist-tag (OIDC, no token anywhere; provenance from
#        this workflow). Nothing is public until a maintainer approves the staged versions on npmjs.com with two-factor
#        authentication (npm stage approve). The trusted-publisher configuration of every package allows staging only
#        (scripts/npm-trust.sh). The job prints SHA512SUMS: the maintainer rebuilds the release commit and compares before approving.
#   release  (contents: write, no id-token) — installs nothing and runs no repository code but the notes script
#     5. The tag v<version> on the release commit, and a draft GitHub Release with the notes of the changelog — a draft, never
#        public: the maintainer publishes it after approving on npm.
#
# Never start it again after a run that staged: the tag guard only helps once the tag exists, and a staged version is invisible to
# `npm view`. What to do with a failed or rejected run: CONTRIBUTING.md › "Pull requests and releases" › "When a run fails".
#
# scripts/check-release.ts (a part of `pnpm run ci`) checks this file as a review aid, not as a barrier: dispatch only, the
# guard first and nothing switching away from the release commit after it, id-token only in the job that stages — which has no
# checkout, no pnpm and runs nothing but the hash checks and `npm stage publish`, and is the only job in `environment: npm-release` —
# the write token only in the release job's last
# two steps, every action pinned by full SHA, no npm publish, no token, no cache, a GitHub Release only as a draft, no expression
# inside a script.
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: build the tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.guard.outputs.commit }}
      version: ${{ steps.guard.outputs.version }}
      latest: ${{ steps.guard.outputs.latest }}
      dist-tag: ${{ steps.guard.outputs.dist-tag }}
      sums: ${{ steps.pack.outputs.sums }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0 # the guard finds the release commit and the previous tag in the history
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the action's default restores a pnpm store by itself
      # Checks out the release commit (detached); every step below works on it. Imports node:* only: it runs before any install.
      - id: guard
        run: node scripts/release-guard.ts
      - run: pnpm install --frozen-lockfile
      # The tarballs as they will be staged: a clean build, the content rules, publint, attw — and the release rules.
      - run: pnpm run ci --only build,pack:check,check-release
      # Packed and hashed here, staged by the next job: the tree must still be exactly the release commit the guard checked out.
      - id: pack
        name: pack the tarballs
        env:
          COMMIT: ${{ steps.guard.outputs.commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          status=$(git status --porcelain)
          test -z "$status"
          node scripts/release-pack.ts "$RUNNER_TEMP/tarballs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
          retention-days: 1
          if-no-files-found: error

  stage:
    name: stage the packages on npm
    needs: build
    # Trusted publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # npm trusts the staging only from this environment; its deployment branches are `main` and `*.x`.
    environment: npm-release
    permissions:
      contents: read
      id-token: write # OIDC: trusted publishing and provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: ${{ runner.temp }}/tarballs
      # npm 11.15 or later stages. Keep the version the one in .nvmrc (the Node that built the tarballs): check-release compares them.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          package-manager-cache: false # the action's default restores a pnpm store by itself
      # Staged, not published: every package waits for a maintainer's approval with 2FA on npmjs.com. Only the files SHA512SUMS names
      # are staged, and only after the build job's hash of SHA512SUMS and the hash of every tarball matched.
      - name: stage the tarballs
        env:
          TARBALLS: ${{ runner.temp }}/tarballs
          SUMS: ${{ needs.build.outputs.sums }}
          VERSION: ${{ needs.build.outputs.version }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
          # No npmrc of the user or the machine: npm reads a registry, a proxy and TLS settings from them. Two different paths that do
          # not exist (npm refuses the same file as user and as global config).
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/no-userconfig
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/no-globalconfig
        run: |
          set -o pipefail
          [[ "$DIST_TAG" =~ ^latest(-[0-9]+(\.[0-9]+)?)?$ ]]
          mkdir "$RUNNER_TEMP/empty"
          cd "$TARBALLS"
          printf '%s  SHA512SUMS\n' "$SUMS" | sha512sum --check --strict -
          sha512sum --check --strict SHA512SUMS
          # The artifact holds SHA512SUMS and the files it names, nothing else (no dotfile, no directory): npm would read a .npmrc.
          expected=$( { echo ./SHA512SUMS; awk '{ print "./" $2 }' SHA512SUMS; } | sort )
          found=$(find . -mindepth 1 | sort)
          test "$expected" = "$found"
          cat SHA512SUMS
          # npm runs in an empty directory, so it finds no project npmrc; the tarballs are named by absolute path.
          cd "$RUNNER_TEMP/empty"
          while read -r _ name; do
            test "${name%-"$VERSION".tgz}" != "$name"
            npm stage publish "$TARBALLS/$name" --provenance --access public --tag="$DIST_TAG" < /dev/null
          done < "$TARBALLS/SHA512SUMS"

  release:
    name: tag and draft the release
    needs: [build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the draft GitHub Release
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # the action's default restores a pnpm store by itself
      - name: tag the release commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -o pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          # A re-run of this job (after a failed draft) finds its own tag: the same commit is fine, another one is not.
          existing=$(git ls-remote origin "refs/tags/v$VERSION^{}" | cut -f1)
          if [ -z "$existing" ]; then existing=$(git ls-remote origin "refs/tags/v$VERSION" | cut -f1); fi
          if [ -z "$existing" ]; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' tag -a "v$VERSION" -m "v$VERSION" "$COMMIT"
            encoded=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$encoded"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $encoded" push origin "refs/tags/v$VERSION"
          elif [ "$existing" = "$COMMIT" ]; then
            echo "::notice::v$VERSION is already tagged on $COMMIT"
          else
            echo "::error::v$VERSION already points to $existing, not to the release commit $COMMIT"
            exit 1
          fi
      # A draft: it becomes public only when the maintainer publishes it, after approving the staged versions on npm. The tag binds
      # it to the release commit; it is the latest release only when the version is above npm's latest.
      - name: draft the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          LATEST: ${{ needs.build.outputs.latest }}
        run: |
          node scripts/release-notes.ts "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          gh release create "v$VERSION" --draft --verify-tag --title "v$VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" --latest="$LATEST"
