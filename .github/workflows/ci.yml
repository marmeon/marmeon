# The same parts as `pnpm run ci` (scripts/ci.ts) — one job per suite that needs a database, one for the tarballs, one for the image,
# so they run side by side on their own runners. Locally `pnpm run ci` runs them all, one after the other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: build, typecheck, lint, test, size, types:check, website:check, check-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0, the version from "packageManager" (pnpm 12 needs 6.1)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only build,typecheck,lint,test,size,types:check,website:check,check-release

  pack:
    # The tarballs: pack:check builds clean and checks every tarball (rules, publint, attw); pack:smoke runs the packed
    # create-marmeon outside the checkout — the starter kit with pnpm, a blank app with npm — installs, tests, lints, builds and
    # starts them (pnpm's store from setup-node; npm fetches the third-party packages), the kit once on the Redis drivers.
    name: pack:check, pack:smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # As in compose.yaml (marmeon-redis): the kit's CACHE_DRIVER=redis / SESSION_DRIVER=redis step.
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only pack:check,pack:smoke --no-compose

  image:
    # create-marmeon --docker as a Docker image: marmeon make:docker → docker build → docker run (non-root, no .env, /up, the health
    # check, SIGTERM with SHUTDOWN_DELAY → exit 0, read-only root, --workers=2, a worker's exit 70) and the image's size; then the docs' image
    # (apps/website/Dockerfile): its contents, read-only, and deploy/website/compose.yaml behind Caddy over HTTP/2.
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only build,image

  pgsql:
    name: test:pgsql
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # As in compose.yaml (marmeon-pgsql): the port and credentials test:pgsql uses.
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: marmeon
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: marmeon
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U marmeon"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only build,test:pgsql --no-compose

  redis:
    name: test:redis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # As in compose.yaml (marmeon-redis).
      redis:
        image: redis:8-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only build,test:redis --no-compose

  s3:
    name: test:s3
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # SeaweedFS needs its identities file (compose.yaml "configs"), which a service container cannot mount: scripts/ci.ts
    # starts it with docker compose, as it does locally.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci --only build,test:s3
