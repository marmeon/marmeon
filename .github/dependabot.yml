# Keeps the commit pins of the workflows current (the version in each comment moves with them).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # init and analyze must stay on one commit; the group keeps their updates in one pull request.
    groups:
      codeql:
        patterns:
          - github/codeql-action*
